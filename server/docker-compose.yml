services:
  redis:
    image: redis:7-alpine
    container_name: nuclear-random-redis
    restart: unless-stopped
    mem_limit: 96m
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - nuclear-random-net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: nuclear-random-influxdb
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:${INFLUXDB_HOST_PORT:-19086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - nuclear-random-net

  api:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    container_name: nuclear-random-api
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      - redis
    environment:
      NUCLEAR_RANDOM_REDIS_URL: redis://redis:6379/0
      NUCLEAR_RANDOM_REDIS_ENTROPY_KEY: nuclear_random:v2:entropy_bytes
      NUCLEAR_RANDOM_MAX_POOL_BYTES: ${MAX_POOL_BYTES:-1048576}
      NUCLEAR_RANDOM_POOL_LOW_WATERMARK_BYTES: ${POOL_LOW_WATERMARK_BYTES:-1024}
      NUCLEAR_RANDOM_RAW_BITS_PER_CLICK: ${RAW_BITS_PER_CLICK:-2}
      NUCLEAR_RANDOM_RANDOM_WAIT_SECONDS: ${RANDOM_WAIT_SECONDS:-90}
      NUCLEAR_RANDOM_CLICK_TIMELINE_WINDOW_SECONDS: ${CLICK_TIMELINE_WINDOW_SECONDS:-900}
      NUCLEAR_RANDOM_RANDOM_RATE_LIMIT_PER_MINUTE: ${RANDOM_RATE_LIMIT_PER_MINUTE:-120}
      NUCLEAR_RANDOM_INGEST_TOKEN: ${INGEST_TOKEN}
      NUCLEAR_RANDOM_INFLUXDB_URL: http://influxdb:8086
      NUCLEAR_RANDOM_INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      NUCLEAR_RANDOM_INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      NUCLEAR_RANDOM_INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-19000}:8000"
    networks:
      - nuclear-random-net

  site:
    build:
      context: ..
      dockerfile: server/site/Dockerfile
    container_name: nuclear-random-site
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - api
    ports:
      - "127.0.0.1:${SITE_HOST_PORT:-19100}:80"
    networks:
      - nuclear-random-net

  collector:
    build:
      context: ..
      dockerfile: server/collector/Dockerfile
    container_name: nuclear-random-collector
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["collector"]
    depends_on:
      - redis
      - influxdb
    devices:
      - "${GEIGER_SERIAL_PORT:-/dev/ttyACM0}:${GEIGER_SERIAL_PORT:-/dev/ttyACM0}"
    environment:
      GEIGER_SERIAL_PORT: ${GEIGER_SERIAL_PORT:-/dev/ttyACM0}
      GEIGER_SERIAL_BAUD: ${GEIGER_SERIAL_BAUD:-115200}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    networks:
      - nuclear-random-net

networks:
  nuclear-random-net:
    name: nuclear-random-net

volumes:
  redis-data:
  influxdb-data:
