[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nuclear-random"
version = "0.1.0"
description = "Client library for unbiased random integers backed by Geiger counter entropy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nuclear Random contributors" }]
keywords = ["random", "entropy", "geiger", "quantum", "redis"]
dependencies = ["httpx>=0.27"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "influxdb-client>=1.43",
  "pydantic-settings>=2.3",
]
collector = [
  "pyserial>=3.5",
  "redis>=5.0",
  "influxdb-client>=1.43",
]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/example/nuclear-random"
Documentation = "https://github.com/example/nuclear-random#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/nuclear_random"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "server/api", "server/collector"]

[tool.ruff]
line-length = 100
target-version = "py310"

